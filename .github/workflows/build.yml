name: Windows build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build application
        run: dotnet build BetterQuickSettings.csproj -c Release --nologo
      - name: Build check runner
        run: dotnet build checks/BetterQuickSettings.Checks.csproj -c Release --nologo
